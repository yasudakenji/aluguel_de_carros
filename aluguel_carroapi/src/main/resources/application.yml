spring:
  application:
    name: aluguel_carroapi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ac}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
